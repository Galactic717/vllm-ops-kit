---
- name: Install host hardening packages
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Authorize the operator key
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ ops_ssh_public_key }}"

- name: Use SSH public key authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-vllm-ops.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Allow the operator's SSH source before enabling UFW
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ ansible_port | default(22) }}"
    from_ip: "{{ ops_admin_cidr }}"

- name: Allow the trusted TLS clients
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "443"
    from_ip: "{{ ops_client_cidr }}"

- name: Deny unlisted inbound connections
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure jail for SSH authentication
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/vllm-ops-ssh.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      port = {{ ansible_port | default(22) }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
