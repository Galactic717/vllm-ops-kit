    <circle cx="725" cy="196" r="8" fill="#7be2ca"/>
    <circle cx="775" cy="92" r="4" fill="#90daca"/>
    <circle cx="775" cy="196" r="4" fill="#90daca"/>
    <circle cx="775" cy="300" r="4" fill="#eac278"/>
    <g fill="#102733" stroke-width="1.4">
