      <rect x="825" y="159" width="390" height="74" rx="10" stroke="#498378"/>
      <rect x="825" y="263" width="390" height="74" rx="10" stroke="#88734e"/>
    </g>
    <g font-size="14" font-weight="650" letter-spacing="1.6">
      <text x="847" y="82" fill="#90daca">WINDOWS</text>
      <text x="847" y="186" fill="#90daca">CPU KUBERNETES</text>
      <text x="847" y="290" fill="#eac278">NVIDIA KUBERNETES</text>
    </g>
    <g font-size="21" font-weight="650" fill="#eff6f8">
