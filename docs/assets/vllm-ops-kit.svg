    <text x="56" y="191" fill="#f2f7f9" font-size="78" font-weight="750" letter-spacing="-4">vllm-ops-kit</text>
    <text x="60" y="240" fill="#d6e4ec" font-size="27" font-weight="550">Verifiable local-to-cloud AI serving</text>
    <text x="61" y="295" fill="#adc6d1" font-size="20">Deploy with Helm. Check the stack end to end.</text>
    <text x="61" y="325" fill="#adc6d1" font-size="20">Inspect latency, dependencies, and error budgets.</text>
    <path d="M726 196H775m0-104v208m0-208h53m-53 104h53m-53 104h53" fill="none"
