<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="392" viewBox="0 0 1280 392" role="img" aria-labelledby="title desc">
  <title id="title">vllm-ops-kit</title>
  <desc id="desc">Verifiable AI serving. Three deployment profiles: Windows llama.cpp, CPU Kubernetes with kind, and NVIDIA Kubernetes with vLLM.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b1928"/>
      <stop offset="1" stop-color="#112e3c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7594a4" opacity=".22"/>
    </pattern>
    <linearGradient id="accent">
      <stop stop-color="#7be2ca"/>
      <stop offset=".66" stop-color="#4ccdb3"/>
      <stop offset="1" stop-color="#eac278"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="390" rx="24" fill="url(#background)" stroke="#426172" stroke-width="2"/>
  <path d="M722 19H1248V373H722Z" fill="url(#grid)"/>
  <path d="M61 58h95" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
