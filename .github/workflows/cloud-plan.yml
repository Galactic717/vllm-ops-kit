name: Cloud Terraform plan
on:
  workflow_dispatch:
    inputs:
      target:
        description: Provider and environment
        type: choice
        required: true
        options:
          - dev-free-tier/aws
          - dev-free-tier/gcp
          - prod-gpu/aws
          - prod-gpu/gcp
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: cloud-plan
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ inputs.target }}
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - if: endsWith(inputs.target, '/aws')
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: endsWith(inputs.target, '/gcp')
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: Plan with short-lived credentials
        env:
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          AWS_STATE_REGION: ${{ vars.AWS_STATE_REGION }}
          GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          DEV_TFVARS: ${{ vars.DEV_TFVARS_JSON }}
          GPU_TFVARS: ${{ vars.GPU_TFVARS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          root="terraform/envs/$TARGET"
          profile="${TARGET%/*}"
          provider="${TARGET##*/}"
          if [[ "$profile" == dev-free-tier ]]; then tfvars="$DEV_TFVARS"; else tfvars="$GPU_TFVARS"; fi
          jq -e --arg provider "$provider" '.[$provider] | objects' <<<"$tfvars" > "$RUNNER_TEMP/ops.tfvars.json"
          if [[ "$provider" == aws ]]; then
            backend=(-backend-config="bucket=$AWS_STATE_BUCKET" -backend-config="region=$AWS_STATE_REGION"
              -backend-config="key=$profile/terraform.tfstate" -backend-config=use_lockfile=true -backend-config=encrypt=true)
          else
            backend=(-backend-config="bucket=$GCP_STATE_BUCKET" -backend-config="prefix=$profile")
          fi
          terraform -chdir="$root" init "${backend[@]}"
          terraform -chdir="$root" plan -no-color -lock-timeout=60s -var-file="$RUNNER_TEMP/ops.tfvars.json"
