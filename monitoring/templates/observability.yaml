apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}
  labels:
    observability: vllm-ops-kit
spec:
  {{- .Files.Get "prometheus/llm_slo_alerts.yml" | nindent 2 }}
{{- range $path, $_ := .Files.Glob "grafana/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ base $path | trimSuffix ".json" | replace "_" "-" }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
