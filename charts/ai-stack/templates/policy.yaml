{{- if .Values.networkPolicy.enabled }}
{{- $name := include "ops.name" . }}
{{- $rules := list
  (dict "component" "api" "port" 8000 "ingress" true "monitoring" true)
  (dict "component" "gateway" "port" 8088 "ingress" true "monitoring" true "from" (list "worker"))
  (dict "component" "backend" "port" 8080 "monitoring" true "from" (list "gateway"))
  (dict "component" "postgres" "port" 5432 "from" (list "api" "worker" "beat" "dependencies"))
  (dict "component" "redis" "port" 6379 "from" (list "api" "worker" "beat" "dependencies"))
  (dict "component" "dependencies" "port" 9108 "monitoring" true) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-isolate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
{{- range $rule := $rules }}
{{- if or (ne $rule.component "backend") (ne $.Values.backend.mode "external") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-allow-{{ $rule.component }}
spec:
  podSelector:
    matchLabels:
      {{- include "ops.selector" (dict "root" $ "component" $rule.component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $source := $rule.from }}
        - podSelector:
            matchLabels:
              {{- include "ops.selector" (dict "root" $ "component" $source) | nindent 14 }}
        {{- end }}
        {{- if and $rule.ingress $.Values.ingress.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.ingress.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        {{- end }}
        {{- if and $rule.monitoring $.Values.monitoring.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.monitoring.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        {{- end }}
        {{- if and (not $rule.from) (not (and $rule.ingress $.Values.ingress.enabled)) (not (and $rule.monitoring $.Values.monitoring.enabled)) }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: helm-test
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- else if has $rule.component (list "api" "gateway") }}
        - podSelector:
            matchLabels:
              {{- include "ops.selector" (dict "root" $ "component" "helm-test") | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ $rule.port }}}
{{- end }}
{{- range $source := $rule.from }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-{{ $source }}-to-{{ $rule.component }}
spec:
  podSelector:
    matchLabels:
      {{- include "ops.selector" (dict "root" $ "component" $source) | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- if and (eq $rule.component "backend") (eq $.Values.backend.mode "external") }}
        - ipBlock:
            cidr: {{ required "backend.externalEgressCIDR is required for external mode with network policies" $.Values.backend.externalEgressCIDR | quote }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "ops.selector" (dict "root" $ "component" $rule.component) | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ ternary $.Values.backend.externalEgressPort $rule.port (and (eq $rule.component "backend") (eq $.Values.backend.mode "external")) }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-helm-test
spec:
  podSelector:
    matchLabels:
      {{- include "ops.selector" (dict "root" . "component" "helm-test") | nindent 6 }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "ops.selector" (dict "root" . "component" "api") | nindent 14 }}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - podSelector:
            matchLabels:
              {{- include "ops.selector" (dict "root" . "component" "gateway") | nindent 14 }}
      ports: [{protocol: TCP, port: 8088}]
{{- end }}
