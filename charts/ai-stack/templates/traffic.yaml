{{- $name := include "ops.name" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ required "ingress.host is required with TLS" $.Values.ingress.host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- range $path := list "/v1/models" "/v1/chat/completions" "/v1/extract" }}
          - path: {{ $path }}
            pathType: Exact
            backend:
              service:
                name: {{ $name }}-gateway
                port: {name: http}
          {{- end }}
          {{- range $path := list "/healthz" "/oauth" "/workflows" "/runs" "/approvals" "/documents" "/evals" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-api
                port: {name: http}
          {{- end }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-api}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpuUtilization }}
{{- end }}
{{- if .Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ops.selector" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
